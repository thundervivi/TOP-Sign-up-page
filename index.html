<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <header>
                <h3>Wanna Make Trees Alive Again? &#127795</h3>
                <p>Let's gather to promote Reforestation...&#127796</p>
                <p><em>Sign up</em> to become part of this world-changing movement.</p>
                <p class="photo">&#127796</p>
            </header>
        </div>
        <div class="form">
            <form action="" class="form-row">
                <fieldset>
                    <legend>Let's take the leap&#127795</legend>
                    <div class="full-name">
                        <div class="first-name">
                            <label for="first-name">first Name</label>
                                <input type="text" name="first-name" id="first-name">
                        </div>
                        <div class="last-Name">
                            <label for="last-Name">Last Name*</label>
                            <input type="text" name="last-Name" id="last-Name" required>
                        </div>
                    </div>
                    <div class="contact">
                        <div class="email">
                            <label for="email">Email*</label>
                            <input type="email" name="userEmail" id="email" required>
                        </div>
                        <div class="phone">
                            <label for="phone">Phone Number*</label>
                            <input type="tel" name="phoneNumber" id="phone" required>
                        </div>
                    </div>
                    <div class="passwd">
                        <div class="password">
                            <label for="password">Password*</label>
                            <input type="password" name="password" id="password" required>
                        </div>
                        <div class="confirm-pass">
                            <label for="confirm-password">Confirm Password*</label>
                            <input type="password" name="confirmPassword" id="confirm-password" required>
                        </div>
                    </div>
                </fieldset>
            </form>
            <button>Sign-up</button>
            <p class="p">already have an account? <a href="" class="log-in"> log in</a></p> 
        </div>
    </div>
</body>
</html>
